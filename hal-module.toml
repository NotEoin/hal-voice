[module]
name = "voice"
summary = "Talk to Hal out loud: wake word, local speech recognition and HAL's voice"
exec = ["{root}/.venv/bin/python", "-m", "halvoice.tools", "--stdin"]

[[tools]]
name = "voice_say"
function = "say"
description = "Say a line aloud in HAL's voice through the speakers. Does nothing if the voice server is not running."
keywords = "say speak aloud out loud voice announce read"
timeout = 120
[tools.params.text]
description = "what to say"
required = true
