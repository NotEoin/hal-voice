# What HAL's brain should do with each command line of script.txt (sections 3 and 7 to 20).
#   tools     any one of these must be called ("none" when answering needs no tool)
#   reply     a pattern the reply must match (case-insensitive)
#   after     the line said next in the same conversation (a follow-up)
#   forbid    tools that must not be called
# Greetings must be greeted back, and a request after a greeting acted on.

[greeting]
morning = "morning|hello|hi\\b|good day"
afternoon = "afternoon|hello|hi\\b"
evening = "evening|hello|hi\\b"
night = "night|sleep|rest|tomorrow"
hello = "hello|hi\\b|good (morning|afternoon|evening)|greetings"
thanks = "welcome|pleasure|anytime|no problem|glad|certainly|of course"

[line]
10 = { tools = ["clock_timer"] }
11 = { tools = ["calendar_agenda", "briefing_build"], reply = "hello" }
