[module]
name = "transcribe"
summary = "Transcribe audio and video files, record meetings from the microphone, and save summarised notes"
# faster-whisper lives in its own environment; bin/run finds one that has it.
exec = ["{root}/bin/run", "--stdin"]

[[tools]]
name = "transcribe_file"
function = "transcribe"
description = "Transcribe an audio or video file to text."
keywords = "transcribe audio recording voice memo podcast video text"
timeout = 3600
[tools.params.path]
required = true
[tools.params.timestamps]
type = "boolean"

[[tools]]
name = "transcribe_record_start"
function = "record_start"
description = "Start recording the microphone, for a meeting, lecture or voice memo."
keywords = "record meeting start recording lecture memo"
[tools.params.title]

[[tools]]
name = "transcribe_record_stop"
function = "record_stop"
description = "Stop the recording, transcribe it and save a summarised note with decisions and actions in the vault."
keywords = "stop recording transcribe meeting notes"
timeout = 3600
[tools.params.save]
type = "boolean"

[[tools]]
name = "transcribe_status"
function = "recording"
description = "Whether a recording is running and for how long."

[[tools]]
name = "transcribe_save_note"
function = "save_note"
description = "Save a transcript as a summarised note in the vault."
timeout = 600
[tools.params.text]
required = true
[tools.params.title]
