schema = 2

[module]
name = "voice"
summary = "Speak text aloud with the Hal voice"
pack = "voice"
# {root} is this manifest's directory; its parent is the checkout with the .venv
exec = ["{root}/../.venv/bin/python", "-m", "halvoice.hubtool"]
protocol = "oneshot"

# `hal ext add voice` runs this: the venv, the speech models and GPT-SoVITS (several GB).
[[install]]
id = "setup"
summary = "Build the voice venv and download the speech models and GPT-SoVITS (several GB)"
run = ["{root}/../setup-voice.sh", "--yes", "--with-wake"]
timeout = 7200  # the hub's ceiling: several GB of downloads must not be cut off
network = true

[[tools]]
name = "voice_say"
function = "say"
description = "Say a line aloud in HAL's voice through the speakers. Does nothing if the voice server is not running."
keywords = "say speak aloud out loud voice announce read"
timeout = 120
tier = "act"
# the GPT-SoVITS server is TCP on 127.0.0.1:9880; a tool without network has its own loopback
network = true
untrusted_output = false
reviewable = true
reversible = true
[tools.params.text]
type = "string"
description = "what to say"
required = true
max_length = 500
