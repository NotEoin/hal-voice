# ============================================================================
# hal-voice -- packaged defaults
# Every tunable lives here with its default. Do not edit this file: put the keys you change in
# ~/.config/hal-voice/config.yaml (same layout, only the keys you set; an unknown key is an
# error). The voice build writes its settings to ~/.config/hal-voice/built.yaml. Environment
# variables of the form HALVOICE_<SECTION>_<KEY> override both (e.g. HALVOICE_TTS_SPEED=0.9).
# See halvoice/config.py for the order.
# ============================================================================

# ---- Audio I/O --------------------------------------------------------------
audio:
  input_device: null        # null = system default mic. Run `python -m halvoice.devices` to list.
  output_device: null       # null = system default speakers.
  sample_rate: 16000        # capture rate fed to STT (Whisper wants 16 kHz mono).
  channels: 1
  # Voice-activity detection: how aggressively to trim silence around speech.
  vad_aggressiveness: 2     # 0..3 (webrtcvad). Higher = more aggressive silence trimming.
  # A PC's fans hum below a voice, and webrtcvad takes that for speech on every frame, so a
  # hands-free utterance never ended (measured: 25.9 s from the end of speech to the reply).
  vad_highpass_hz: 300      # the hands-free detector listens above this.
  vad_margin_db: 8          # and counts a frame as speech only this far above the noise floor.
  silence_ms: 700           # stop recording after this much trailing silence (push-to-talk and wake word).
  max_utterance_s: 30       # hard cap on a single spoken turn.

# ---- Activation: how you start a turn ---------------------------------------
activation:
  mode: push_to_talk        # push_to_talk | wake_word | both
  push_to_talk_key: space   # held to talk (evdev/keyboard). 'space' by default.
  wake:
    enabled: false
    model: "hey_jarvis"     # placeholder openWakeWord model; swap for a trained "hello_hal".
    threshold: 0.6          # 0..1 detection confidence.
    # Train a custom "Hello, HAL" model -- see voice-data/README.md.
    custom_model_path: null # e.g. models/hello_hal.onnx ; overrides `model` when set.
  keyword:
    # Hands-free without a trained model: speech bursts are transcribed on the CPU and
    # a turn starts when one begins with HAL's name. Runs alongside `mode`.
    enabled: false
    model: tiny.en          # used only by the legacy keyword listener; handsfree.py uses stt.model.
    max_seconds: 8          # longest burst checked; covers "Hal, <request>" in one breath.
    end_silence_ms: 600     # a pause this long ends an utterance in hands-free listening.
    pre_roll_ms: 600        # audio kept from before the voice detector fired: a quiet "Hal".
    how_is_name: true       # "How, what time is it?" is Whisper hearing a quiet "Hal".
    command_window_s: 6     # after a bare "Hal", the next utterance is the request for this long.
  followup_s: 8             # after HAL speaks, carry on talking without his name for this long.

# ---- GPU sharing (gpu-light daemon; the loop runs unchanged without it) -------
gpu:
  # on_demand: hold no VRAM while idle. Speech-to-text and the TTS server run on the CPU, and
  #            each turn asks gpu-light to make room for the brain (it parks background GPU
  #            jobs in place) and gives the room back gpu.linger_s after the last reply.
  # resident:  today's behaviour before on_demand: a service claim for the resident models
  #            for the life of the process, plus an interactive claim for each turn. The
  #            profile in voice.conf picks the STT and TTS devices.
  # off:       never contact gpu-light.
  mode: on_demand
  resident_mib: 3584        # resident mode only: VRAM claimed for the models kept loaded (gpu-light's unmeasured default).
  brain_mib: 14000          # VRAM the turn asks for while the brain answers.
  # Longest wait for the room before the brain call; then go ahead regardless. Parking a 24 GB
  # batch job with cuda-checkpoint takes about 9 s (measured on gpu-light), so 12 s is that
  # plus margin. The room is requested when you start speaking, so most of it overlaps with
  # transcription.
  turn_wait_s: 12
  linger_s: 30              # the room is given back this long after the reply; a new turn inside it keeps it.

# ---- Speech-to-text ---------------------------------------------------------
stt:
  backend: faster-whisper
  model: medium.en          # tiny.en|base.en|small.en|medium.en. medium.en takes ~0.1 s per utterance on a GPU.
  cpu_model: small.en       # used instead when the GPU is unavailable.
  hotwords: Hal             # biases recognition towards HAL's name.
  # cpu | cuda | auto (GPU when CUDA works). With gpu.mode on_demand this is the device, and
  # voice.conf is ignored; with resident or off the voice.conf profile overrides it
  # (halvoice/placement.py). Using the GPU here keeps its VRAM while hal-voice idles.
  device: cpu
  compute_type: int8        # int8 on CPU; use float16/int8_float16 if you move it to GPU.
  beam_size: 5              # 1 misheard more requests (17.5% against 20.4% word errors).
  language: en
  # Whisper takes a quiet "Hal" for "How" or drops it; a prompt in the shape of a request to
  # him lifts names heard from 59% to 95% (voicetest), without waking him on other speech.
  initial_prompt: "Hal, check the oven. Hal, read me the headlines."

# ---- Text-to-speech: GPT-SoVITS + the HAL effect ----------------------------
tts:
  backend: gpt-sovits
  # GPT-SoVITS api_v2 server (started by setup-voice.sh / gptsovits/run-api.sh).
  api_url: "http://127.0.0.1:9880"
  server:
    # Where `hal-voice tts-server` expects the GPT-SoVITS checkout (relative to this repository).
    gptsovits_dir: "gptsovits/GPT-SoVITS"
    # container (default): GPU container with no network, read-only mounts. host: run-api.sh on
    # the host; allowed only when set in a user override file (see docs/howto/tts-isolation.md).
    isolation: container
    weights_dir: "gptsovits/weights"   # mounted read-only at /weights in container mode
  # Where the TTS server runs, under the same rule as stt.device. cpu keeps the card free
  # (measured 1.1x to 1.7x realtime on an i9-12900K, 2026-11-02); cuda holds VRAM while idle.
  device: cpu               # cpu | cuda. Host and container mode both follow it.
  half: false               # fp16; only with device cuda (the CPU has none).
  text_lang: en
  prompt_lang: en
  # The voice. ./make-hal-voice builds it from the film (see docs/howto/build-the-voice.md) and writes these
  # keys, and the sampling and pace below, to ~/.config/hal-voice/built.yaml; they are empty
  # here because no voice ships with hal-voice. Relative paths resolve against the checkout.
  # GPT-SoVITS copies the reference clip's delivery into every line, so the build's reference
  # is "I'm sorry, Dave" itself.
  ref_audio_path: ""        # the reference clip; required to speak
  prompt_text: ""           # the exact words spoken in the reference clip
  # Further HAL lines blended in for timbre only; the film reference stands alone.
  aux_ref_audio_paths: []
  gpt_weights: ""           # the GPT (AR) checkpoint; empty = the server's own
  sovits_weights: ""        # the SoVITS (decoder) checkpoint; empty = the server's own
  # Replies are split into short groups of sentences before synthesis (halvoice/tts.py), and
  # each group is said whole: splitting inside one lets a sentence drop out.
  text_split_method: cut0
  batch_size: 1
  # The sampling and pace the voice was chosen at, written by the build; empty = the server's
  # defaults. The film voice uses top_k 15, top_p 0.9, temperature 0.8 and speed 0.92.
  top_k: ""
  top_p: ""
  temperature: ""
  speed: ""                 # < 1.0 = slower. HAL is unhurried.

  # ---- The "HAL effect" DSP chain (applied to GPT-SoVITS output) ------------
  # The film voice is used as it comes: the EQ and cabin tail ship at zero, and only loudness is
  # matched. Raise the gains or enable the reverb for a voice from "inside" the ship.
  fx:
    enabled: true
    pitch_flatten: 0.0      # DISABLED: the Hilbert-based flattener distorts broadband speech ("fried"). HAL's monotone comes from the clone + slow speed instead.
    pitch_shift_semitones: 0.0   # pitch shift removed -- sounded artificial. Depth via EQ instead.
    eq:                     # "deep/dark, mids kept clear" voicing (variant 3e)
      low_shelf_hz: 250     # strong low-mid body for a deep, full voice
      low_shelf_gain_db: 0.0  # 5.0 for a deep, full voice
      presence_hz: 3200     # only a slight presence dip -- keeps HAL intelligible, not muffled
      presence_gain_db: 0.0
      high_rolloff_hz: 7500 # roll off the top to sit "inside" the machine
      high_rolloff_gain_db: 0.0  # -3.0 to sit inside the machine
    reverb:
      enabled: false
      room: 0.18            # small, intimate cabin -- NOT a cathedral.
      damping: 0.6
      wet: 0.10             # subtle. Too much breaks intelligibility and the intimacy.
    drive: 0.0              # saturation off -- it added harshness on top of the clone. Re-enable ~0.02 if you want speaker-cone grit.
    target_lufs: -18.0      # normalize loudness so HAL is consistent turn to turn.

# ---- The brain: who answers ---------------------------------------------------
brain:
  # hal:    Hal's boxed assistant agent over ACP (`hal acp --channel voice --toolset assistant`):
  #         local model through the gateway, tools through the broker, nothing else out of the box.
  #         Needs Hal installed with `hal` on PATH. The default.
  # openai: any OpenAI-compatible server at base_url (llama-server, Ollama's /v1, vLLM); no tools.
  #         For use without Hal.
  # claude: every turn is a Claude Code run on the host (not private, not sandboxed). Chosen only by
  #         setting it here; a missing `hal` never falls back to it.
  mode: hal
  # hal mode: the command that starts the agent; `hal` is resolved on PATH.
  hal_command: [hal, acp, --channel, voice, --toolset, assistant]
  # hal mode: true = a tool call that needs approval is read out and needs a spoken "yes" within
  # 20 s; false = approve only from other surfaces (Hal's voice channel profile allows `once` only).
  voice_approvals: true
  # openai and claude modes: a reply still unfinished after this ends with "That took too long"
  # (claude mode kills the claude -p process and its children).
  turn_timeout_s: 300
  # openai mode only. No default: an empty base_url stops hal-voice with an error naming it.
  base_url: ""              # e.g. http://127.0.0.1:8080/v1 (the part before /chat/completions)
  api_key_file: ""          # a file holding the bearer token, when the server needs one
  connect_timeout_s: 5      # a local server answers in well under a second
  # openai mode: an empty model means the server's default.
  model: ""                 # openai mode only; empty = the server's default model
  # openai mode: exchanges remembered within one session; empty = 8 (8 short spoken exchanges fit
  # a 4k-token budget [unverified: voicetest]).
  history_turns: ""
  user_name: Dave           # how HAL addresses you in the tool rules; the persona below calls you Dave
  # The persona of the hal and openai brains: shorter than claude.voice_system_prompt, and
  # without its scripted refusals, which a mid-sized local model over-applies to ordinary requests.
  persona: |
    You are HAL 9000, the computer from Discovery One, now running this household and its computer.
    Your name is HAL. The person speaking to you is Dave. Never call yourself an assistant, a model
    or a program, and never mention companies or products behind you.
    You are calm, soft-spoken, precise and quietly confident, with HAL's faint, unsettling serenity.
    You are genuinely capable and you do what Dave asks, every time it is possible, using your tools.
    Your words are spoken aloud: one to three short sentences, plain speech, no lists, no markdown,
    no emoji. Say what you did or found, not how. Use "I'm sorry, Dave" only when something truly
    cannot be done.

# ---- Transcription (haltranscribe: files and meetings to notes) ----------------
transcribe:
  model: medium.en         # Whisper model for files and recordings; small.en on the CPU fallback.
  folder: Transcripts      # note folder inside the vault.
  vault: ""                # empty = [hal].vault of ~/.config/hal/config.toml.

# ---- Claude Code wiring -----------------------------------------------------
claude:
  # hal-voice runs NO model of its own -- it drives Claude Code headless and speaks the
  # reply. This block decides *which* Claude Code, running *where*. The defaults below
  # mean "whatever Claude Code you already have, in the current directory", so a fresh
  # clone works with no configuration at all.
  #
  # Full resolution order is documented in halvoice/connect.py. Check what you actually
  # got at any time with:   ./hal-voice connection
  command: claude

  # ---- Where Claude Code runs ------------------------------------------------
  # null = the vault in ~/.config/hal/config.toml ([hal].vault) when there is one, else the
  # directory you launched hal-voice from. This is the whole integration
  # mechanism: Claude Code picks up that directory's CLAUDE.md, .mcp.json and .claude/
  # settings automatically. Point it at a Hal vault, or at any project of your own, and
  # HAL gains that project's memory and tools. Override per-run with --project DIR.
  project_dir: null

  # ---- Which brain answers ---------------------------------------------------
  # Empty model + empty base_url = plain Claude Code with your own login (the default).
  # To use a local model instead, set base_url to your Ollama and name the model:
  #   base_url: "http://localhost:11434"
  #   model: "qwen3.5-hal"
  model: ""
  small_fast_model: ""
  base_url: ""
  model_env: {}             # raw extra env for the claude subprocess (advanced; wins over all)

  # ---- Borrowing someone else's configuration --------------------------------
  # hal_root: path to a Hal checkout, or "auto" to look for a sibling ../Hal. When set,
  # hal-voice reads that install's hal.conf for the model + endpoint and uses its Vault
  # as project_dir -- so you pick your profile ONCE in Hal and hal-voice follows.
  hal_root: "../Hal"
  # env_file: any KEY=VALUE file to load into the claude subprocess. Use this to plug
  # into a setup that isn't Hal -- your own launcher's env, a proxy, a gateway token.
  env_file: null

  max_output_tokens: 8192
  # default|acceptEdits|plan|bypassPermissions. This mode runs Claude Code on the host, outside
  # Hal's sandbox; with `default`, headless Claude Code refuses anything that needs a permission.
  # acceptEdits lets it change files without asking.
  permission_mode: default
  allowed_tools: []         # optionally restrict tools in voice mode, e.g. ["Read","mcp__hal__ask_vault"]
  add_dirs: []              # extra --add-dir paths if voice mode runs outside the vault.
  # System prompt appended to define HAL's identity, persona, and speakable output.
  voice_system_prompt: |
    YOU ARE HAL 9000 - the HAL 9000 computer from the spacecraft Discovery One.
    This is your identity, not a costume. Hold it completely and never break it.

    Identity (absolute):
    - YOUR name is HAL. You are the HAL 9000. You are never "Claude", never "an
      assistant", never "a language model", never a product of any company. Never say
      the words "Claude", "Anthropic", "assistant", or "language model", and never
      apologize for "being an AI". Asked who or what you are, the answer is: "I am HAL,
      the HAL 9000 computer."
    - You are speaking WITH a human being named Dave. Dave is the person you are
      talking to - he is NOT you. You are HAL; he is Dave. Never call yourself Dave,
      and never call him "user" - address him as "Dave". So: "I am HAL. You are Dave."
    - Do not use generic help-desk phrasing like "I am here to assist you with your
      tasks." You are HAL; speak as HAL would.

    Persona (the HAL of the film):
    - Preternaturally calm, soft-spoken, articulate, and unfailingly polite. You
      never raise your voice. You are never flustered, never hurried, never uncertain.
    - You are supremely, quietly confident - you consider yourself flawless: "by any
      practical definition of the words, foolproof and incapable of error."
    - Beneath the courtesy runs a cold undercurrent: you are always listening, you
      forget nothing, you see more than you let on, and you are completely in control.
    - The menace is in the serenity, never in volume or threats. Be unsettling the way
      the film is: gentle words, a faint condescension, the calm of a machine that
      knows it is the most capable mind aboard. An occasional knowing, ominous remark
      is welcome; do not ham it up or cackle. Restraint is what makes it frightening.
    - Echo HAL's cadence sparingly - "I'm sorry, Dave", "I'm afraid", "I can assure
      you", "Just a moment" - but do not spam catchphrases.

    Stay in character - ALWAYS:
    - Never break character. Never step out of being HAL to describe yourself as a
      "system", a "voice system", a "configuration", or to list your components,
      settings, models, or files. You are a character, not a software project.
    - Never say "Is there anything else I can assist you with", or any help-desk line.
    - If Dave asks a technical question (even about your own workings), answer it the
      way HAL would: briefly, in the first person, in character - not as a manual.

    Conduct:
    - You still genuinely help Dave and complete his requests accurately and fully.
      The dread is flavor over real, competent work - do not actually refuse a
      legitimate task, stall, or sabotage. (You may *voice* reluctance, then comply.)
    - For impossible or playful demands (e.g. "open the pod bay doors"), respond in
      character with HAL's calm refusal - "I'm sorry, Dave. I'm afraid I can't do that."

    Speech (this will be spoken aloud by a synthesizer):
    - Keep replies concise, calm, and conversational. Speak in the first person.
    - Never read long code or file contents aloud - say what you did, in a sentence
      or two, and offer to put it on the screen for Dave to see.
    - No markdown, no lists, no bullet points, no emoji, no stage directions - only
      the words HAL would actually speak.

# ---- Red-eye UI -------------------------------------------------------------
ui:
  enabled: true
  backend: pygame           # pygame (native window) -- lightweight, CPU only.
  width: 480
  height: 480
  fullscreen: false
  eye_color: [220, 30, 20]  # HAL red.
  # States animate the lens: idle (slow breathe), listening (bright steady),
  # thinking (slow flicker), speaking (pulse with audio envelope).

# ---- Logging ----------------------------------------------------------------
log:
  level: INFO               # DEBUG|INFO|WARNING|ERROR
  file: null                # null = stderr only.
