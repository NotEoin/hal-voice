name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - run: uv tool install 'ruff>=0.15,<1'
      - run: ruff check .
      - run: ruff format --check .
      - run: scripts/ascii-check.sh
      - run: scripts/portability-check.sh
      - run: scripts/audio-guard.sh
      - run: scripts/lint-reasons-check.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test --frozen
      - run: uv run --frozen --extra test pytest -q

  wsl:
    name: wsl2 (ubuntu 24.04)
    runs-on: windows-latest
    # Never run yet: it stays advisory until the first green run shows the suite passes under
    # WSL2, so an unproven runner cannot block a merge
    continue-on-error: true
    env:
      # WSL does not inherit the runner environment: WSLENV names what to pass in (/p converts a path)
      WSLENV: GITHUB_WORKSPACE/p
    steps:
      - name: Keep line endings as LF
        # Scripts and fakes with a CRLF shebang line would not run in WSL
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: pipx python3-venv libportaudio2

      - name: Copy the checkout into the WSL filesystem
        # /mnt/d has no Unix permissions, and is slow
        shell: wsl-bash {0}
        run: |
          src="$(wslpath -u "$GITHUB_WORKSPACE" 2>/dev/null || printf %s "$GITHUB_WORKSPACE")"
          rm -rf "$HOME/hal-voice"
          cp -r "$src" "$HOME/hal-voice"

      - name: Install uv
        shell: wsl-bash {0}
        run: |
          pipx install uv==0.8.0
          "$HOME/.local/bin/uv" --version

      - name: Test
        # Runners have no audio device, GPU or docker daemon: the suite uses fakes, and the
        # `integration` and `docker` markers stay deselected by the default addopts.
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH" UV_PYTHON_DOWNLOADS=never
          cd "$HOME/hal-voice"
          uv run --extra test pytest -q -p no:warnings

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 -O "${base}/${tarball}"
          curl -sSfL --max-time 120 -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - run: ./gitleaks git --log-opts=--all --no-banner
