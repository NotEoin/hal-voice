[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hal-voice"
version = "0.1.0"
description = "A HAL 9000 voice interface: speak to it, it answers aloud"
readme = "README.md"
license = { file = "LICENSE" }
# numpy 1.x wheels stop at cp312, and several audio libraries still need numpy 1.x
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML>=6.0,<7",
  "numpy>=1.24,<2.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
  # the -wheels fork ships prebuilt binaries; plain webrtcvad needs a C compiler
  "webrtcvad-wheels>=2.0.14",
  "faster-whisper>=1.0,<2",
  "pynput>=1.7.6",
  "scipy>=1.10",
  "pyloudnorm>=0.1.1",
  "pedalboard>=0.9.0",
  "mcp>=2.3,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
# tflite-runtime is the least portable dependency here, so wake word stays opt-in
wake = ["openwakeword>=0.6.0"]
ui = ["pygame>=2.5.0"]
test = ["pytest>=8.3,<10"]

[project.scripts]
hal-voice = "halvoice.cli:main"

[tool.setuptools]
packages = ["halvoice", "voicebuild", "voicetest"]

[tool.setuptools.package-data]
voicetest = ["script.txt", "tools.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the checkout imports without an install
markers = ["integration: builds and installs a wheel; slow, run on request (-m integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["gptsovits/GPT-SoVITS", "voice-data/raw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "T20", "RUF", "PLC2401"]
# S603 and S607 flag every subprocess call; argv-only calls with a timeout are the design.
ignore = [
  "S603",
  "S607",
  "E501",  # the formatter wraps code; prose strings and comments are left as written
  "RUF001", "RUF002", "RUF003",  # scripts/ascii-check.sh gates non-ASCII text for every file type
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # pytest asserts; fixtures hold dummy secrets and paths
# Command-line programs print their results for the person at the terminal.
"halvoice/cli.py" = ["T201"]  # entry point
"halvoice/connect.py" = ["T201"]  # `hal-voice connection`
"halvoice/devices.py" = ["T201"]  # `hal-voice devices`
"halvoice/doctor.py" = ["T201"]  # `hal-voice doctor`
"halvoice/tools.py" = ["T201"]  # one-shot worker: JSON result on stdout
"halvoice/config.py" = ["T201"]  # `python -m halvoice.config` dumps the resolved config
"halvoice/stt.py" = ["T201"]  # `python -m halvoice.stt` prints transcripts
"halvoice/tts.py" = ["T201"]  # `python -m halvoice.tts` usage message
"halvoice/claude_client.py" = ["T201"]  # `python -m halvoice.claude_client` manual test
"voicebuild/**" = ["T201"]  # `make-hal-voice` progress output
"voicetest/**" = ["T201"]  # `hal-voice voicetest` reports
"gptsovits/**" = ["T201"]  # training and tuning scripts run by hand
"voice-data/**" = ["T201"]  # dataset scripts run by hand
